- date: 2026-02-01
  project: grid-intelligence
  text: First day-ahead price forecasting prototype for a single node in the US PJM market.

- date: 2026-03-01
  project: grid-intelligence
  text: Forecasting extended from one node to many, alongside a first product interface for searching and comparing nodes on a map.

- date: 2026-04-01
  project: grid-intelligence
  text: Battery dispatch optimizer finalized and validated, turning price forecasts into charge and discharge schedules within the battery's physical limits.

- date: 2026-05-01
  project: grid-intelligence
  text: Research into how grid congestion shapes node-level prices, feeding the next generation of the forecasting layer.

- date: 2026-06-01
  project: grid-intelligence
  text: First European industrial client received battery sizing and storage investment analysis.

- date: 2026-08-01
  project: grid-intelligence
  text: Second industrial client received a full deliverable set (proposal, financial workbook and companion report), reconciled line by line against the client's own financial model.

- date: 2026-08-15
  project: grid-intelligence
  text: Began modelling revenue stacking, so one battery can earn from several value streams instead of one.

- date: 2026-03-15
  project: energy-terminal
  text: Top presentation in Energy Terminal's Deep Decarb challenge, for a three-pillar strategy modelled in MIT's En-Roads simulator.

- date: 2026-04-09
  project: grid-intelligence
  text: Best in Showcase and the Climate & Sustainability Prize at the 2026 Duke Startup Showcase, $8,000 in combined non-dilutive awards.

- date: 2026-04-10
  project: energy-terminal
  text: Winning team in Energy Terminal's Emerging Leaders Program case competition, on whether a plant should interconnect to Alberta or Saskatchewan.

- date: 2026-04-20
  project: grid-intelligence
  text: Grid Intelligence selected for the 2026 US Hult Prize Nationals, representing Duke University.

- date: 2026-05-01
  project: solar-district-cup
